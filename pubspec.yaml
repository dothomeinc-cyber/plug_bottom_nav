name: plug_bottom_nav
description: >-
  Plug-and-play Blinkit/Uber/Instacart-style bottom navigation for Flutter.
  Auto-generates GoRouter StatefulShellRoute, Riverpod tab state, per-seller
  carts and an automatic add-to-cart button. No manual shell-route code.
version: 0.1.0
repository: https://github.com/phinehas/plug_bottom_nav

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2-dev.2
  go_router: ^14.6.2
  animations: ^2.0.11

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
